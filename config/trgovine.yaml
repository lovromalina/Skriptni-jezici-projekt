# Izrazi kojima se na stranici prepoznaje deklarirana najniža cijena u 30 dana.
# Popis se dopunjuje stvarnim formulacijama pronađenim na stranicama trgovina.
lowest_30d_patterns:
  hr: ["najniža cijena u (posljednjih|zadnjih) 30 dana"]
  de: ["niedrigster preis (der letzten|in den letzten) 30 tage"]
  nl: ["laagste prijs (van de|in de) (afgelopen|laatste) 30 dagen"]
  fr: ["prix le plus bas (des|au cours des) 30 derniers jours"]
  es: ["precio más bajo (de los|en los) últimos 30 días"]
  cs: ["nejnižší cena za (posledních )?30 dn[íi]"]
  pl: ["najniższa cena z (ostatnich )?30 dni"]
